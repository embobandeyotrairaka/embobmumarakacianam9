      --bg:#000000; --text:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --card:#0a0a0a;
      --accent:#ef4444; --accent2:#f97316;

    /* ===== RESET & BASE ===== */
    *,*::before,*::after{ box-sizing:border-box }
    html{ -webkit-text-size-adjust:100%; background:#000 }
    html,body{ height:100%; margin:0 }
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
      color:var(--text); background:var(--bg); line-height:1.45;
      overflow-x:hidden;
    }
    img,video,canvas,svg,iframe{ max-width:100%; height:auto; display:block }

    /* ===== APP BAR ===== */
    .appbar{
      position:sticky; top:0; z-index:20; background:rgba(0,0,0,.85);
      backdrop-filter:saturate(180%) blur(8px); -webkit-backdrop-filter:saturate(180%) blur(8px);
      border-bottom:1px solid var(--line);
    }
    .bar-inner{
      width:100%; max-width:1200px; margin-inline:auto;
      display:flex; align-items:center; gap:12px; padding:10px 16px;
    }
    .brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.2px }
    .logo{ display:inline-grid; place-items:center; width:28px; height:28px; border-radius:6px; background:#fff; color:#000; font-size:14px; font-weight:800 }
    .spacer{ flex:1 }
    .btn{ appearance:none; border:0; padding:10px 14px; border-radius:12px; background:#fff; color:#000; font:inherit; font-weight:700; cursor:pointer; touch-action:manipulation }
    .btn:hover{ background:#e4e4e7 }

    /* ===== BANNER INFO ===== */
    .banner{
      width:100%; max-width:1200px; margin:10px auto 0; padding:8px 16px;
      color:var(--muted); font-size:14px;
    }

    /* ===== SLOT IKLAN BANNER (otomatis tersembunyi jika kosong) ===== */
    .ad-banner{
      width:100%; max-width:760px; margin:10px auto 0; padding-inline:16px;
      display:flex; justify-content:center; align-items:center; overflow:hidden;
    }
    .ad-banner:empty{ display:none }
    .ad-banner > *{ max-width:100% }

    /* ===== LAYOUT ===== */
    .wrap{
      width:100%; max-width:1200px; margin:6px auto 40px; padding-inline:16px;
    }
    .player-shell{ display:grid; place-items:center; margin-top:16px }

    .phone{
      position:relative;
      width:clamp(240px, 92vw, 420px);
      aspect-ratio:9/16;
      border-radius:22px; overflow:hidden; background:#000;
      border:1px solid var(--line);
      box-shadow:0 10px 40px rgba(255,255,255,.04), 0 3px 12px rgba(0,0,0,.6);
    }
    .phone video,.phone img{ width:100%; height:100%; object-fit:cover }

    .meta{
      width:100%; max-width:760px; margin:22px auto 0; padding:0 6px;
      text-align:center; color:var(--muted); font-size:13px;
    }
    .player-shell .ad-banner{ margin-top:22px; padding-inline:0 }

    @media (min-width:1024px){
      .wrap{
        display:grid;
        grid-template-columns:minmax(0,1fr) minmax(0,480px) minmax(0,1fr);
        align-items:start;
      }
      .player-shell{ grid-column:2 }

    :focus-visible{ outline:2px solid #60a5fa; outline-offset:3px }

    .sp-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px }

    .sp-box{
      display:flex; align-items:center; gap:14px; width:100%; cursor:pointer;
      font:inherit; color:inherit; text-align:left;
      padding:12px 14px; border-radius:12px;
      background:#eef3fc; border:3px solid #c3d4f5;

    .sp-box:focus-visible{ outline:2px solid #2563eb; outline-offset:3px }
    .sp-box.is-loading,.sp-box.is-done{ cursor:default }
    .sp-check{
      position:relative; flex:none; display:grid; place-items:center;
      width:34px; height:34px; border-radius:8px;

    .sp-ring{

    .sp-tick{

    .sp-box.is-loading .sp-check{ border-radius:50%; border-color:#c3d4f5; box-shadow:none }
    .sp-box.is-loading .sp-ring{ opacity:1; animation:sp-pulse 1s ease-in-out infinite }
    @keyframes sp-pulse{

  <!-- ===== PEMUTAR + VIDEO BERGANTI OTOMATIS ===== -->
  <script>
    const v = document.getElementById('video');
    const meta = document.getElementById('metaTime');
    function fmt(t){ if(!isFinite(t)) return '--:--'; const m = Math.floor(t/60); const s = Math.floor(t%60).toString().padStart(2,'0'); return `${m}:${s}`; }
    v.addEventListener('loadedmetadata', ()=>{ meta.textContent = `0:00 / ${fmt(v.duration)}`; });
    v.addEventListener('timeupdate',     ()=>{ meta.textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`; });

    const VIDEO_LIST_URL = "videos.txt";   // daftar link, satu link per baris
    const AUTO_NEXT      = true;           // true = setelah selesai otomatis lanjut ke video berikutnya
    const FALLBACK_LIST  = ["https://cdn.aceimg.com/hz7MnufIc.mp4"]; // dipakai jika videos.txt gagal dimuat
    const QUEUE_KEY      = "video_queue_v1";

    let LIST = [];

    function hashList(list){
      const s = list.join("|"); let h = 0;
      for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
      return h + ":" + list.length;
    }
    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }
    function readState(){
      try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || "null"); }catch(e){ return null; }
    }
    function writeState(s){
      try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(s)); }catch(e){}
    }

    // Antrean acak per pengunjung: semua video tampil dulu sebelum ada yang berulang
    function nextVideo(){
      if(LIST.length === 1) return LIST[0];
      const sig = hashList(LIST);
      let st = readState();
      const lastShown = (st && st.sig === sig && typeof st.lastShown === "number") ? st.lastShown : -1;

      if(!st || st.sig !== sig || !Array.isArray(st.order) || st.pos >= st.order.length){
        const order = shuffle(LIST.map((_,i)=>i));
        if(order[0] === lastShown){ [order[0],order[1]] = [order[1],order[0]]; }
        st = { sig, order, pos:0, lastShown };
      }
      const idx = st.order[st.pos++];
      st.lastShown = idx;
      writeState(st);
      return LIST[idx];
    }

    function parseList(text){
      const seen = new Set();
      return text.split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("#") && /^https?:\/\//i.test(l))
        .filter(l => !seen.has(l) && seen.add(l));
    }

    async function initVideo(){
      try{
        const res = await fetch(VIDEO_LIST_URL, { cache:"no-cache" });
        if(!res.ok) throw new Error("HTTP " + res.status);
        LIST = parseList(await res.text());
      }catch(e){
        LIST = [];
      }
      if(!LIST.length) LIST = FALLBACK_LIST.slice();
      v.src = nextVideo();
      v.load();
    }

    v.addEventListener("ended", ()=>{
      if(!AUTO_NEXT || LIST.length < 2) return;
      v.src = nextVideo();
      v.play().catch(()=>{});
    });

    initVideo();
  </script>

  <!-- ===== BAHASA OTOMATIS: Indonesia untuk pengunjung dari Indonesia, Inggris untuk negara lain ===== -->
  <script>
  (function(){
    const I18N = {
      id: {
        upload:    "Unggah",
        advertise: "Pasang Iklan",
        hint:      "Tekan putar untuk memulai",
        noVideo:   "Browser kamu tidak mendukung pemutar video HTML5."
      },
      en: {
        upload:    "Upload",
        advertise: "Advertise",
        hint:      "Press play to start",
        noVideo:   "Your browser does not support HTML5 video."
      }
    };

    const GEO_URL  = "https://get.geojs.io/v1/ip/country.json";
    const LANG_KEY = "site_lang_geo";

    function setLang(lang){
      if(!I18N[lang]) lang = "en";
      const d = I18N[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const k = el.getAttribute("data-i18n");
        if(d[k]) el.textContent = d[k];
      });
    }
    function guessLang(){
      return ((navigator.language || "").toLowerCase().indexOf("id") === 0) ? "id" : "en";
    }
    function cached(){ try{ return sessionStorage.getItem(LANG_KEY); }catch(e){ return null; } }
    function remember(l){ try{ sessionStorage.setItem(LANG_KEY, l); }catch(e){} }

    async function detectLang(){
      try{
        const ctrl = new AbortController();
        const timer = setTimeout(()=>ctrl.abort(), 3000);
        const res = await fetch(GEO_URL, { signal: ctrl.signal });
        clearTimeout(timer);
        const data = await res.json();
        if(data && data.country){
          const l = (String(data.country).toUpperCase() === "ID") ? "id" : "en";
          remember(l);
          return l;
        }
      }catch(e){}
      return guessLang();
    }

    // Tampilkan dulu bahasa perkiraan (cache / bahasa browser), lalu sesuaikan dengan negara asli
    setLang(cached() || guessLang());
    if(!cached()) detectLang().then(setLang);
  })();
  </script>

  <script>
  (function(){
    /* ================== KONFIG POPUP SUPPORT US ================== */
    const POPUP_ENABLED        = true;   // false = matikan popup
    const POPUP_LINK           = "https://wk.trinkbinful.com/iBspFhFXlGza3NOa8/141917"; // direct link tujuan (isi bawaan = link Monetag di file ini)
    const POPUP_TARGET         = "newtab"; // "newtab" = buka di tab baru, "same" = halaman ini dialihkan
    const POPUP_DELAY          = 800;    // jeda sebelum popup muncul (milidetik)
    const POPUP_ONCE           = false;   // true = tampil sekali per sesi browser setelah pengunjung verifikasi
    const POPUP_DISMISS        = false;   // true = boleh ditutup dengan Esc / klik area gelap
    const POPUP_VERIFY_MS      = 1000;   // lama animasi lingkaran "verifying"
    const POPUP_CLOSE_DELAY    = 700;    // jeda setelah ceklis muncul sebelum pindah ke direct link
    /* ============================================================= */

    if(!POPUP_ENABLED) return;
    const overlay = document.getElementById("supportPopup");
    const box     = document.getElementById("supportCheck");
    const label   = document.getElementById("spLabel");
    let busy = false;

    try{ if(POPUP_ONCE && sessionStorage.getItem("supportDone") === "1") return; }catch(e){}

    function close(){ if(!busy) overlay.classList.add("hidden"); }
    setTimeout(function(){ overlay.classList.remove("hidden"); try{ box.focus({ preventScroll:true }); }catch(e){} }, POPUP_DELAY);

    box.addEventListener("click", function(){
      if(busy) return;
      busy = true;

      // Mode tab baru: tab dibuka sekarang (di dalam klik) agar tidak diblokir browser, diarahkan setelah animasi
      let tab = null;
      if(POPUP_TARGET === "newtab" && POPUP_LINK){
        try{ tab = window.open("about:blank", "_blank"); if(tab) tab.opener = null; }catch(e){}
      }

      // Tahap 1: lingkaran mengecil-membesar
      box.classList.add("is-loading");
      box.setAttribute("aria-busy", "true");
      label.textContent = "Verifying\u2026";

      setTimeout(function(){
        // Tahap 2: tanda ceklis
        box.classList.remove("is-loading");
        box.classList.add("is-done");
        box.removeAttribute("aria-busy");
        box.setAttribute("aria-checked", "true");
        label.textContent = "Verified";
        try{ sessionStorage.setItem("supportDone", "1"); }catch(e){}

        // Tahap 3: pindah ke direct link
        setTimeout(function(){
          busy = false;
          if(!POPUP_LINK){ close(); return; }
          if(tab && !tab.closed){ tab.location.href = POPUP_LINK; close(); }
          else{ location.href = POPUP_LINK; }
        }, POPUP_CLOSE_DELAY);
      }, POPUP_VERIFY_MS);
    });

    if(POPUP_DISMISS){
      overlay.addEventListener("click", function(e){ if(e.target === overlay) close(); });
      document.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });
    }
  })();
  </script>
